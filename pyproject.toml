[project]
name = "vibe"
version = "0.1.2"
description = "Visual Behavior adaptation — vision-only whole-body control for humanoids"
readme = "readme.md"
# Python 3.12 supports the published warp-optix wheels.
requires-python = ">=3.12,<3.13"
license = "BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Lokesh Krishna", email = "lkrajan@usc.edu" }]
dependencies = [
    # Simulator source checkouts and the reviewed mjlab patch are owned by deps.lock.
    "mjlab==1.6.1+vibe.1",
    "mujoco-core[rendering]==4.0.1",
    "mujoco-warp==4.0.1",
    "warp-lang==1.18.0",
    # Capped, not just floored: rsl_rl's WandbLogWriter passes the legacy
    # `Settings(start_method=...)`, which 0.29 turned from a deprecation warning
    # into a hard pydantic `extra_forbidden`. mjlab asks only for >=0.22.3, so a
    # fresh env resolves to a broken wandb and `train` dies before iteration 0 —
    # on the default logger, which is wandb. 0.28.0 is the last good release.
    "wandb>=0.22.3,<0.29",
    "einops",
    "joblib",                    # GRAIL motion staging through orcs
    "omegaconf",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "transformers==4.57.6",   # frozen vision backbones (vibe.encoders.zoo)
    # numpy/torch come with mjlab; mocke, rsl_rl and orcs are git deps owned by
    # deps.lock, never listed here.
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vibe" = ["release.json"]
"vibe.export.encoder" = ["*.yaml"]

# mjlab imports this module at startup, which registers every task.
[project.entry-points."mjlab.tasks"]
vibe = "vibe"

[project.scripts]
export-agent = "vibe.export.agent.export_onnx:main"
export-encoder = "vibe.export.encoder.export_onnx:main"
vibe-download-released-models = "vibe.release:main"

[project.optional-dependencies]
optix = ["warp-optix==0.3.0"]
perloco = ["orcs[perloco]"]
dev = ["pytest>=8.0", "ruff>=0.4"]
deploy = ["onnx", "onnxruntime"]

# `dependencies/` holds editable checkouts of orcs/mocke/rsl_rl/assets, each with
# its own suite. A bare `pytest` from the root would collect those too: they need
# extras vibe does not install (onnxruntime), and their basenames collide.
[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["dependencies", "data", ".venv"]

[tool.ruff]
src = ["src"]
indent-width = 4
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
